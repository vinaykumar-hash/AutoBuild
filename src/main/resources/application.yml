spring:
  application:
    name: pipelineforge
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipelineforge}
    username: ${DB_USERNAME:pipelineforge}
    password: ${DB_PASSWORD:pipelineforge}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 2000
      pool-name: PipelineForgeHikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 6
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  task:
    execution:
      pool:
        core-size: ${TASK_CORE_SIZE:4}
        max-size: ${TASK_MAX_SIZE:8}
        queue-capacity: ${TASK_QUEUE_CAPACITY:100}
      thread-name-prefix: pipelineforge-worker-
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN:10}
    connection-timeout: 20s
    keep-alive-timeout: 15s
    max-connections: 8192
    accept-count: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    root: INFO
    org.springframework: INFO
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha
security:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    issuer: ${JWT_ISSUER:pipelineforge}
    expiration-minutes: ${JWT_EXP_MINUTES:60}
  encryption:
    secret: ${ENCRYPTION_SECRET:change-me-change-me-change-me-change-me}
  webhook:
    github-secret: ${GITHUB_WEBHOOK_SECRET:}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    limit: ${RATE_LIMIT_COUNT:100}
    duration-seconds: ${RATE_LIMIT_DURATION:60}
deployment:
  simulation:
    fail-stage: ${DEPLOYMENT_FAIL_STAGE:}
    failure-rate: ${DEPLOYMENT_FAILURE_RATE:0.0}
  runner:
    container-name: ${RUNNER_CONTAINER:pipelineforge-runner}
    health-check-url: ${RUNNER_HEALTH_URL:http://localhost:3000}
    startup-wait-seconds: ${RUNNER_STARTUP_WAIT:5}
cache:
  ttl:
    pipeline-status: ${CACHE_TTL_PIPELINE_STATUS:PT30S}
    deployment-summary: ${CACHE_TTL_DEPLOYMENT_SUMMARY:PT60S}
    repository: ${CACHE_TTL_REPOSITORY:PT5M}
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
logging:
  level:
    root: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
management:
  endpoint:
    health:
      show-details: never
